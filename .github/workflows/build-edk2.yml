name: Build edk2-gunyah firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu uuid-dev acpica-tools nasm build-essential git

      - name: 克隆 edk2-gunyah (含 edk2 子模块)
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            -b droidvm https://github.com/Droid-VM/edk2-gunyah.git

      - name: 编译固件
        working-directory: edk2-gunyah
        run: |
          ./build.sh -DPCI_CAM_MODE=FALSE

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: edk2-gunyah-fd
          path: |
            edk2-gunyah/edk2-gunyah.fd
            edk2-gunyah/edk2-gunyah.vars.fd
          retention-days: 7
          if-no-files-found: error
