# UniXNU-droidvm 客户机构建 CI
# 运行环境: GitHub 公开仓库的 macOS runner (免费)
# 作用: 在云端 Mac 上编译 XNU 内核 + UniXNU 引导 + 签名策略, 产出可刷入 DroidVM 的磁盘镜像
# 注意: 本项目不随仓库分发任何苹果固件; 构建时从 Apple 公开服务器拉取 IPSW(约 8 GiB)。

name: Build UniXNU-droidvm guest

on:
  workflow_dispatch:
    inputs:
      chip_id:
        description: "16 位十六进制 platform seed (openssl rand -hex 8 生成, 每次构建保持不变)"
        required: true
      ipsw_build:
        description: "IPSW build 标识, 仅用作缓存 key (默认 21H461)"
        required: false
        default: "21H461"

jobs:
  build:
    # 必须是 macOS runner; 公开仓库才免费用
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: 检查 Xcode (项目仅需 xcodebuild + iphoneos SDK, 未钉死 27.1)
        run: |
          set -e
          echo "可用 Xcode 版本:"; ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || { echo "::error::无 iphoneos SDK"; exit 1; }

      - name: "安装依赖 (llvm-objcopy/nm + ipsw + unifdef/cmake/ninja + Python 3.12)"
        run: |
          set -e
          brew install llvm ipsw unifdef cmake ninja || true
          brew install python@3.12 || true
          ls /opt/homebrew/opt/llvm/bin/ | grep -E "objcopy|nm" || { echo "::error::llvm 工具缺失"; exit 1; }
          which python3.12 || true

      - name: 克隆 UniXNU 与设备仓库
        run: |
          set -e
          git clone --recurse-submodules -b wip/droidvm https://github.com/Droid-VM/UniXNU
          git clone -b wip/hackintosh https://github.com/Droid-VM/UniXNU-droidvm

      # 构建输出与 IPSW 都落在 UniXNU/out 下; 缓存它可让重跑跳过 8 GiB 下载与已完成步骤
      - name: 给 prepare-xnu-source.py 打认证补丁 (避免 api.github.com 匿名限流 403)
        working-directory: UniXNU
        run: |
          set -e
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('scripts/prepare-xnu-source.py')
          src = p.read_text()
          patch = '''
          # --- ci patch: authenticate api.github.com via GITHUB_TOKEN ---
          if os.environ.get('GITHUB_TOKEN'):
              _real_urlopen = urllib.request.urlopen
              def _urlopen(url, *a, **kw):
                  if isinstance(url, str) and 'api.github.com' in url:
                      req = urllib.request.Request(url, headers={
                          'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                          'User-Agent': 'unixnu-ci'})
                      return _real_urlopen(req, *a, **kw)
                  return _real_urlopen(url, *a, **kw)
              urllib.request.urlopen = _urlopen
          # --- end patch ---
          '''
          anchor = 'import urllib.request\n'
          assert anchor in src, 'anchor not found'
          if 'ci patch' not in src:
              src = src.replace(anchor, anchor + patch, 1)
              p.write_text(src)
              print('patched')
          else:
              print('already patched')
          EOF

      # 让 build-droidvm-gpu.py 失败时把子脚本 (build-adreno740-accelerator.py) 的 stderr 打出来,
      # 否则 capture_output 会把真实报错吞掉
      - name: 给 build-droidvm-gpu.py 打诊断补丁 (失败时输出子脚本 stderr)
        working-directory: UniXNU-droidvm
        run: |
          set -e
          python3 - <<'EOF'
          import re
          from pathlib import Path
          p = Path('scripts/build-droidvm-gpu.py')
          src = p.read_text()
          pat = re.compile(
              r"print\(subprocess\.run\(\['python3', ROOT / 'scripts/build-adreno740-accelerator\.py'\], "
              r"check=True, capture_output=True,\s*\n\s*text=True\)\.stdout, end=''\)")
          repl = (
              "_r = subprocess.run(['python3', ROOT / 'scripts/build-adreno740-accelerator.py'], "
              "check=False, capture_output=True, text=True)\n"
              "print(_r.stdout, end='')\n"
              "import sys as _sys\n"
              "print(_r.stderr, file=_sys.stderr, end='')\n"
              "if _r.returncode:\n"
              "    raise SystemExit('build-adreno740-accelerator failed rc=%d' % _r.returncode)")
          src2, n = pat.subn(repl, src)
          assert n == 1, 'gpu wrapper pattern matched %d times' % n
          p.write_text(src2)
          print('gpu wrapper patched')
          EOF

      # restore/save 拆开: 失败也保存缓存, 下次续跑不再重下 8 GiB IPSW
      - name: 恢复构建输出与 IPSW 缓存
        uses: actions/cache/restore@v4
        with:
          path: UniXNU/out
          key: droidvm-out-${{ inputs.ipsw_build }}-${{ github.run_id }}
          restore-keys: droidvm-out-

      - name: 构建客户机镜像
        working-directory: UniXNU-droidvm
        env:
          CHIP: ${{ inputs.chip_id }}
          # Actions 内置 token: api.github.com 1000 次/小时, 供打补丁后的 prepare-xnu-source.py 使用
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 清理缓存恢复带来的悬空符号链接与运行时临时目录:
          # .cache/firmware 是构建时挂载 dmg 的 symlink, 卸载+缓存恢复后变成悬空链接,
          # 会让 mkdir(parents=True) 撞 FileExistsError (pathlib 经典坑)
          find "$GITHUB_WORKSPACE/UniXNU/out" -type l ! -exec test -e {} \; -print -delete 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/UniXNU/out/droidvm/tree/.cache"
          PY=python3
          command -v python3.12 >/dev/null && PY=python3.12
          $PY --version
          $PY scripts/build-droidvm-all.py \
            --unique-chip-id "$CHIP"

      - name: 保存构建输出与 IPSW 缓存 (失败也保存)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: UniXNU/out
          key: droidvm-out-${{ inputs.ipsw_build }}-${{ github.run_id }}

      - name: 上传构建日志 (失败时诊断用)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: UniXNU/out/**/*.log
          retention-days: 3
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-unixnu-release
          path: UniXNU/out/droidvm/release/
          retention-days: 7
          # 若产物超过单文件上限, 改上传到 Release 或用分卷
